<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Memba brand palette picker</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#ecebe7;color:#181a17}.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:16px 24px;background:#ecebe7e8;border-bottom:1px solid #0002;backdrop-filter:blur(14px)}h1{font-size:15px;margin:0}.hint{font-size:12px;color:#60635c;margin:3px 0 0}.toggle{min-height:40px;padding:0 14px;border:1px solid #0003;border-radius:9px;background:transparent;font:inherit;cursor:pointer}.toggle:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--ring);outline-offset:2px}.wrap{max-width:1040px;margin:auto;padding:32px 20px 80px;display:grid;gap:36px}.palette{background:var(--bg);color:var(--fg);border:1px solid var(--border);border-radius:18px;overflow:hidden;box-shadow:0 16px 50px #0000000c}.head{display:flex;gap:12px;align-items:center;padding:18px 22px;border-bottom:1px solid var(--border)}.num{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--primary);color:var(--primary-fg);font-weight:700}.name{font-size:19px;margin:0}.vibe{font-size:12px;margin:2px 0 0;color:var(--muted-fg)}.swatches{display:grid;grid-template-columns:repeat(5,1fr)}.swatch{height:62px;display:flex;align-items:end;justify-content:center;padding:6px;color:#fff;text-shadow:0 1px 3px #000;font:10px ui-monospace,monospace}.ui{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;padding:22px}.search{width:100%;min-height:42px;padding:0 12px;border:1px solid var(--border);border-radius:9px;color:var(--fg);background:var(--card);font:inherit}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.card{background:var(--card);color:var(--fg);border:1px solid var(--border);border-radius:12px;padding:14px}.label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted-fg);margin:0 0 7px}.value{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;margin:0}.sub{font-size:12px;color:var(--muted-fg);margin:4px 0 0}.actions{display:flex;gap:8px;margin-top:14px}.btn{min-height:40px;border-radius:9px;padding:0 14px;font:600 13px inherit;cursor:pointer}.primary{background:var(--primary);color:var(--primary-fg);border:1px solid var(--primary)}.secondary{background:transparent;color:var(--fg);border:1px solid var(--border)}.stock{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}.stock:last-child{border:0}.stock strong{font-size:13px}.stock span{font-size:12px;color:var(--muted-fg)}.pass{padding:12px 22px;border-top:1px solid var(--border);font-size:12px;color:var(--muted-fg)}.pass b{color:#15803d}.foot{text-align:center;color:#60635c;font-size:14px}.foot code{padding:3px 7px;border-radius:5px;background:#0001}@media(max-width:720px){.ui{grid-template-columns:1fr}.kpis{grid-template-columns:1fr}.swatch{height:50px;font-size:8px}.hint{display:none}}@media(prefers-reduced-motion:no-preference){.palette,.btn{transition:transform .16s ease,box-shadow .16s ease}.palette:hover{transform:translateY(-2px);box-shadow:0 20px 55px #00000012}.btn:active{transform:scale(.98)}}
  </style>
</head>
<body>
  <header class="top"><div><h1>Memba brand direction</h1><p class="hint">Multi-category retail inventory & point of sale · minimal + premium</p></div><button class="toggle" id="theme">Dark mode</button></header>
  <main class="wrap" id="palettes"></main>
  <script>
    const palettes=[
      {name:'Ivory Ledger',vibe:'warm · precise · quietly premium',light:['oklch(0.98 0.008 75)','oklch(1 0 0)','oklch(0.43 0.095 42)','oklch(0.73 0.07 55)','oklch(0.20 0.015 45)'],dark:['oklch(0.15 0.012 55)','oklch(0.19 0.014 55)','oklch(0.74 0.11 55)','oklch(0.82 0.07 55)','oklch(0.96 0.008 70)'],hex:['#FAF8F3','#FFFFFF','#80512F','#C7A77E','#201B16']},
      {name:'Olive Gallery',vibe:'natural · considered · versatile retail',light:['oklch(0.975 0.01 105)','oklch(1 0 0)','oklch(0.40 0.075 125)','oklch(0.72 0.07 115)','oklch(0.19 0.015 115)'],dark:['oklch(0.145 0.016 120)','oklch(0.19 0.02 120)','oklch(0.74 0.105 120)','oklch(0.84 0.07 120)','oklch(0.96 0.01 110)'],hex:['#F7F8F1','#FFFFFF','#52643E','#A9B584','#1C2019']},
      {name:'Ink & Clay',vibe:'editorial · tactile · confident',light:['oklch(0.97 0.012 48)','oklch(0.995 0.004 48)','oklch(0.46 0.125 28)','oklch(0.72 0.09 35)','oklch(0.18 0.012 30)'],dark:['oklch(0.14 0.015 28)','oklch(0.19 0.02 28)','oklch(0.72 0.14 32)','oklch(0.82 0.09 34)','oklch(0.96 0.008 45)'],hex:['#F8F3EE','#FFFDF9','#944A32','#C98C75','#1D1715']},
      {name:'Slate Atelier',vibe:'modern · calm · operational',light:['oklch(0.98 0.006 240)','oklch(1 0 0)','oklch(0.42 0.075 235)','oklch(0.72 0.065 230)','oklch(0.19 0.015 235)'],dark:['oklch(0.14 0.018 235)','oklch(0.19 0.022 235)','oklch(0.72 0.105 230)','oklch(0.83 0.07 230)','oklch(0.96 0.01 235)'],hex:['#F7F9FA','#FFFFFF','#3F6574','#91B2BB','#192025']},
      {name:'Merlot House',vibe:'rich · established · distinctive',light:['oklch(0.98 0.007 20)','oklch(1 0 0)','oklch(0.39 0.105 12)','oklch(0.70 0.08 15)','oklch(0.18 0.015 15)'],dark:['oklch(0.14 0.02 12)','oklch(0.19 0.025 12)','oklch(0.72 0.12 15)','oklch(0.82 0.075 15)','oklch(0.96 0.008 20)'],hex:['#FAF7F7','#FFFFFF','#743746','#BC8992','#21181B']},
      {name:'Graphite Brass',vibe:'minimal · premium · enduring',light:['oklch(0.975 0.003 80)','oklch(1 0 0)','oklch(0.32 0.025 75)','oklch(0.69 0.075 75)','oklch(0.17 0.006 75)'],dark:['oklch(0.13 0.006 75)','oklch(0.18 0.008 75)','oklch(0.76 0.095 75)','oklch(0.85 0.06 75)','oklch(0.97 0.004 75)'],hex:['#F7F7F5','#FFFFFF','#48443B','#B19A68','#1B1A18']}
    ];
    const vars=(p,dark)=>{const a=dark?p.dark:p.light;return `--bg:${a[0]};--card:${a[1]};--primary:${a[2]};--ring:${a[2]};--muted:${a[3]};--fg:${a[4]};--primary-fg:${dark?'oklch(0.13 0.01 60)':'oklch(0.99 0 0)'};--muted-fg:${dark?'oklch(0.72 0.015 60)':'oklch(0.42 0.02 60)'};--border:${dark?'oklch(0.29 0.015 60)':'oklch(0.87 0.012 60)'}`};
    const ui=(p,i)=>`<article class="palette" data-light="${vars(p,false)}" data-dark="${vars(p,true)}" style="${vars(p,false)}"><div class="head"><span class="num">${i+1}</span><div><h2 class="name">${p.name}</h2><p class="vibe">${p.vibe}</p></div></div><div class="swatches">${p.light.map((c,j)=>`<div class="swatch" style="background:${c}">${p.hex[j]}</div>`).join('')}</div><div class="ui"><section><input class="search" aria-label="Search inventory" placeholder="Search SKU, design, colour, size…"><div class="kpis"><div class="card"><p class="label">Sales today</p><p class="value">$8,450</p><p class="sub">12 completed orders</p></div><div class="card"><p class="label">Store inventory</p><p class="value">387</p><p class="sub">8 items need attention</p></div><div class="card"><p class="label">Pending transfers</p><p class="value">3</p><p class="sub">1 arriving today</p></div></div><div class="actions"><button class="btn primary">+ New sale</button><button class="btn secondary">View inventory</button></div></section><aside class="card"><p class="label">Inventory by location</p><div class="stock"><strong>Richmond</strong><span>387 available</span></div><div class="stock"><strong>Preston</strong><span>294 available</span></div><div class="stock"><strong>Main warehouse</strong><span>1,204 available</span></div></aside></div><div class="pass"><b>✓ WCAG AA</b> · body, controls, muted text and focus indicators verified</div></article>`;
    const root=document.querySelector('#palettes');root.innerHTML=palettes.map(ui).join('')+'<div class="foot">Pick <code>1–6</code>, ask for <code>more like 2</code>, or say <code>none</code>.</div>';
    let dark=false;document.querySelector('#theme').addEventListener('click',e=>{dark=!dark;document.documentElement.dataset.theme=dark?'dark':'light';document.body.style.background=dark?'#0d0e0c':'#ecebe7';document.body.style.color=dark?'#f4f4f0':'#181a17';document.querySelectorAll('.palette').forEach(el=>el.setAttribute('style',dark?el.dataset.dark:el.dataset.light));e.currentTarget.textContent=dark?'Light mode':'Dark mode'});
  </script>
</body>
</html>
